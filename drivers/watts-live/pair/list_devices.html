<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Select Device</title>
</head>
<body>
  <h2>Select Devices to Pair</h2>
  <ul id="deviceList"></ul>

  <script>
    // Fetch the discovered devices from the driver
    Homey.emit('list_devices', {}, function(err, devices) {
      if (err) {
        alert('Error fetching devices: ' + err.message);
      } else {
        const deviceList = document.getElementById('deviceList');

        if (devices && devices.length > 0) {
          devices.forEach(device => {
            const listItem = document.createElement('li');
            listItem.textContent = device.name;
            deviceList.appendChild(listItem);
          });
        } else {
          deviceList.textContent = 'No devices found.';
        }
      }
    });
  </script>
</body>
</html>
